 <linearGradient id="window" x1=".05" y1="0" x2="1" y2="1"><stop stop-color="#fff3be"/><stop offset=".5" stop-color="#dda77c"/><stop offset="1" stop-color="#aa8186"/></linearGradient>
 <radialGradient id="sun" cx="60%" cy="18%" r="80%"><stop stop-color="#fff4d6" stop-opacity=".55"/><stop offset="1" stop-color="#372938" stop-opacity=".29"/></radialGradient>
