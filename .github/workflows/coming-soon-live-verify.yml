name: Verify TeHiceEsto Coming Soon Public
on:
  push:
    branches: [coming-soon-live-inspect-20261009]
    paths: ['.github/workflows/coming-soon-live-verify.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify closed demo pages and identify shared CSS
        run: |
          set -euo pipefail
          for category in abuelos aniversario propuesta; do
            curl -sSL --max-time 35 "https://tehiceesto.com/experiencias/$category?qa=release-gate" -o "/tmp/$category.html"
            if grep -q '<title>.*Próximamente' "/tmp/$category.html" && grep -qi 'todavía no está disponible' "/tmp/$category.html"; then
              echo "BLOCKED_DEMO_PASS $category"
            else
              echo "BLOCKED_DEMO_FAIL $category"
              head -c 900 "/tmp/$category.html"; exit 1
            fi
          done
          for page in / /crear; do
            echo "PAGE $page"
            curl -sSL --max-time 35 "https://tehiceesto.com$page" -o "/tmp/page-$(echo "$page" | tr / _).html"
            grep -oE '/_next/static/immutable/chunks/[A-Za-z0-9_-]+\.css' "/tmp/page-$(echo "$page" | tr / _).html" | sort -u | head -40 || true
            echo "JS_CHUNKS"
            grep -oE '/_next/static/immutable/chunks/[A-Za-z0-9_-]+\.js' "/tmp/page-$(echo "$page" | tr / _).html" | sort -u | head -35 || true
          done

          echo 'CHECK_DIRECT_CSS_HOTFIX'
          curl -sS -L --max-time 40 -D /tmp/css-headers 'https://efvvadfxuyieswdqnsjg.supabase.co/functions/v1/tehiceesto-comingsoon-css-bridge' -o /tmp/css-bridge
          head -c 500 /tmp/css-headers
          echo
          echo "CSS_LENGTH=$(wc -c </tmp/css-bridge)"
          grep -q 'Próximamente' /tmp/css-bridge && echo "CSS_PATCH_OK"
          echo 'SHARED_CSS_ASSET_DIAGNOSIS'
          for part in 133ok1w916ki- 18ewy6ykrqrnp 1ud1axunxu08m 2eifnyjw-9z-y 2exyy-y5whww1 2ga1b-zcc6i--; do
            css="https://viralio.net/_next/static/immutable/chunks/$part.css"
            curl -fsSL --max-time 20 "$css" -o /tmp/current.css || continue
            echo "CSS_CHUNK $part $(wc -c </tmp/current.css)"
            if grep -q 'thh-v2-more' /tmp/current.css; then echo "HOME_STYLES $part"; fi
            if grep -q 'thi-simple-card' /tmp/current.css; then echo "CATALOG_STYLES $part"; fi
          done
          curl -sSL --max-time 35 'https://tehiceesto.com/experiencias/mama' -o /tmp/mama.html
          grep -q '0gradzqca-5xg' /tmp/mama.html && echo 'MAMA_SCRIPT_PRESERVED'

      - name: Prepare Chromium for public responsive QA
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Public desktop and mobile release gate QA
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const width of [390,1280]){
            const page=await browser.newPage({viewport:{width,height:844},hasTouch:width<500,isMobile:width<500});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://tehiceesto.com/',{waitUntil:'domcontentloaded',timeout:50000});
            await page.waitForTimeout(500);
            const data=await page.evaluate(()=>{
              const slugs=['abuelos','aniversario','propuesta'];
              return slugs.map(slug=>{
                const a=document.querySelector('.thh-v2-more a[href$="/experiencias/'+slug+'"]');
                return {slug,exists:!!a,pointerEvents:a?getComputedStyle(a).pointerEvents:null,
                   badge:a?getComputedStyle(a,'::after').content:null};
              });
            });
            console.log('HOME_COMING_SOON',width,JSON.stringify(data));
            if(data.some(x=>!x.exists||x.pointerEvents!=='none'||!x.badge.includes('Próximamente')))
              throw Error('Homepage coming-soon visual gate failed');
            await page.goto('https://tehiceesto.com/crear',{waitUntil:'domcontentloaded',timeout:50000});
            await page.waitForTimeout(450);
            const catalog=await page.evaluate(()=>{
              const slugs=['abuelos','aniversario','propuesta'];
              return slugs.map(slug=>{
                const card=document.querySelector('.thi-simple-card-'+slug);
                const btn=card?.querySelector('button.thi-simple-choose');
                const preview=card?.querySelector('a.thi-simple-preview');
                return {slug,exists:!!card,disabledTouch:btn?getComputedStyle(btn).pointerEvents:null,
                  badge:btn?getComputedStyle(btn,'::before').content:null,
                  previewVisible:preview?getComputedStyle(preview).display:null};
              });
            });
            console.log('CATALOG_COMING_SOON',width,JSON.stringify(catalog));
            if(catalog.some(x=>!x.exists||x.disabledTouch!=='none'||!x.badge.includes('Próximamente')||x.previewVisible!=='none'))
              throw Error('Catalog coming-soon purchase gate failed');
            const ready=await page.locator('.thi-simple-card-mama button.thi-simple-choose').isEnabled();
            if(!ready)throw Error('Approved templates unexpectedly disabled');
            for(const slug of ['abuelos','aniversario','propuesta']){
              const blockedResponse=await page.goto('https://tehiceesto.com/experiencias/'+slug,{waitUntil:'domcontentloaded',timeout:50000});
              console.log('PLACEHOLDER_BROWSER',slug,JSON.stringify({status:blockedResponse?.status(),url:page.url(),title:await page.title(),body:(await page.locator('body').innerText()).slice(0,500),html:(await page.content()).slice(0,450)}));
              const h1=page.locator('h1');
              if(await h1.count()===0)throw Error('Missing h1 on blocked route '+slug);
              if(!(await h1.innerText()).toLowerCase().includes(slug))throw Error('Placeholder title mismatch');
              if(!(await page.locator('.tag').innerText()).includes('Próximamente'))throw Error('Placeholder badge absent');
              if(await page.locator('main.thi-experience').count())throw Error('Unfinished experience exposed');
            }
            console.log('PASS_PUBLIC_COMING_SOON',width);
            await page.close();
          }
          await browser.close();
          NODE
