name: Inspect Amistad Live Assets
on:
  push:
    branches: [inspect-amistad-live-20261009]
    paths: ['.github/workflows/inspect-amistad-live-temp.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find public friendship bundle and current page
        run: |
          set -e
          curl -fsSL --max-time 35 'https://tehiceesto.com/experiencias/amistad' -o /tmp/friend.html
          grep -oE '_next/static/immutable/chunks/[A-Za-z0-9_-]+\.js' /tmp/friend.html | sort -u >/tmp/chunks.txt
          cat /tmp/chunks.txt
          while read -r chunk; do
            curl -fsSL --max-time 25 "https://tehiceesto.com/$chunk" -o /tmp/check.js || continue
            echo "ASSET $chunk ($(wc -c </tmp/check.js) bytes)"
            grep -Fq 'friend-evidence-board' /tmp/check.js && echo "FRIENDSHIP_SCENES=$chunk" || true
            grep -Fq 'mama-voice-toggle' /tmp/check.js && echo "MAMA_SCENES=$chunk" || true
            grep -Fq '__thiMamaVoice20261009' /tmp/check.js && echo "ALREADY_PATCHED=$chunk" || true
          done </tmp/chunks.txt

      - name: Validate bridged Javascript for both Amistad and Mamá
        run: |
          set -e
          curl -fsSL --max-time 45 "https://efvvadfxuyieswdqnsjg.supabase.co/functions/v1/mama-demo-js-patch?test=11" -o /tmp/direct.js
          echo "DIRECT_BUNDLE_BYTES=$(wc -c </tmp/direct.js)"
          node --check /tmp/direct.js
          grep -Fq '__thiFriendshipHotfix20261009' /tmp/direct.js
          grep -Fq '__thiMamaVoice20261009' /tmp/direct.js
          echo 'PASS: direct JS bundle parses and preserves both demos'
          curl -fsSL --max-time 45 "https://tehiceesto.com/_next/static/immutable/chunks/0gradzqca-5xg.js?review=friendshipv12" -o /tmp/live.js
          node --check /tmp/live.js
          grep -Fq '__thiFriendshipHotfix20261009' /tmp/live.js
          grep -Fq 'UN RECUERDO PARA' /tmp/live.js
          echo 'PASS: public JS bridge contains the new friendship patch'

      - uses: actions/checkout@v4
      - name: Install mobile browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify live friendship journey, signed pact and Mamá isolation
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          page.on('pageerror',e=>console.log('BROWSER_ERROR',e.message));
          const base='https://tehiceesto.com/experiencias/amistad';
          const scene=async id=>{await page.locator('main.thi-experience[data-scene="'+id+'"]').waitFor({timeout:18000});console.log('SCENE_OK',id)};
          await page.goto(base,{waitUntil:'domcontentloaded',timeout:50000});
          await page.waitForFunction(()=>window.__thiFriendshipHotfix20261009===true,null,{timeout:20000});
          await scene('intro');
          console.log('PATCH_RUNNING',await page.evaluate(()=>window.__thiFriendshipHotfix20261009));
          const door=page.locator('.friend-door-nameplate');
          await door.waitFor({timeout:12000});
          const doorDetails=await door.evaluate(el=>({text:el.textContent,rect:el.getBoundingClientRect().toJSON(),nameSize:getComputedStyle(el.querySelector('.friend-door-name')).fontSize}));
          console.log('DOOR_PLAQUE',JSON.stringify(doorDetails));
          if(!doorDetails.text.includes('Vale')||!doorDetails.text.includes('UN RECUERDO PARA'))throw Error('Door name not integrated in plaque');
          if(parseFloat(doorDetails.nameSize)>34)throw Error('Door text is excessively large');
          await page.locator('[data-action="open-door"]').click();await scene('casefile');
          await page.locator('[data-action="casefile-open"]').click();
          await page.locator('.friend-case-scene [data-action="advance"]').click();await scene('memories');
          await page.locator('.friend-memories [data-action="advance"]').click();await scene('insidejokes');
          for(const i of [0,1,2])await page.locator('[data-action="insidejoke-open"]').nth(i).click();
          await page.locator('.friend-codes [data-action="advance"]').click();await scene('incidents');
          await page.waitForTimeout(350);
          const y=await page.locator('.friend-incidents h2').evaluate(el=>el.getBoundingClientRect().top);
          console.log('INCIDENT_TITLE_TOP',y,'SCROLL_Y',await page.evaluate(()=>window.scrollY));
          if(y<120)throw Error('Mobile incident headline cropped');
          for(const i of [0,1,2])await page.locator('[data-action="incident-open"]').nth(i).click();
          await page.waitForFunction(()=>document.querySelectorAll('.friend-evidence-note.flipped').length>=3,null,{timeout:8000});
          const backState=await page.locator('.friend-evidence-note').nth(2).evaluate(el=>({flipped:el.classList.contains('flipped'),reverse:getComputedStyle(el.querySelector('.friend-note-reverse')).display,secret:el.querySelector('.friend-note-reverse').textContent}));
          console.log('PAPER_FLIP_FRONT_BACK',JSON.stringify(backState));
          if(!backState.flipped||backState.reverse==='none'||!backState.secret.includes('Terminó siendo inolvidable'))throw Error('Back of paper not revealed');
          await page.locator('[data-action="incident-open"]').nth(2).click();
          await page.waitForFunction(()=>!document.querySelectorAll('.friend-evidence-note')[2].classList.contains('flipped'),null,{timeout:6000});
          console.log('PAPER_FLIP_BACK_FRONT',true);
          await page.locator('[data-action="incident-open"]').nth(2).click();
          await page.waitForFunction(()=>document.querySelector('.friend-case-insight')?.textContent?.includes('El plan sin plan'),null,{timeout:9000});
          const panel=await page.locator('.friend-case-insight').innerText();
          console.log('INCIDENT_DETAIL',panel.slice(0,210));
          if(!panel.includes('El plan sin plan'))throw Error('Investigation detail not accessible');
          const ctaVisible=await page.locator('a.floating-create-cta.floating-whatsapp--experience').evaluate(el=>getComputedStyle(el).display!=='none').catch(()=>false);
          if(ctaVisible)throw Error('Floating CTA overlaps friend cards');
          await page.locator('.friend-incidents [data-action="advance"]').click();await scene('proof');
          for(const i of [0,1,2])await page.locator('[data-action="proof-open"]').nth(i).click();
          await page.locator('.friend-presence [data-action="advance"]').click();await scene('letter');
          const visibility=await page.locator('.friend-letter-sheet').evaluate(el=>getComputedStyle(el).visibility);
          console.log('CLOSED_ENVELOPE_PAPER',visibility);
          if(visibility!=='hidden')throw Error('Envelope paper is exposed when closed');
          await page.locator('[data-action="letter-open"]').click();
          await page.locator('.friend-letter-scene [data-action="advance"]').click();await scene('pact');
          for(const i of [0,1,2,3])await page.locator('[data-action="pact-open"]').nth(i).click();
          await page.locator('.friend-pact-scene [data-action="advance"]').click();
          await page.locator('.friend-signature-dialog').waitFor();
          const canvas=page.locator('.friend-signature-canvas');
          const box=await canvas.boundingBox();
          if(!box)throw Error('Signature canvas missing');
          const confirm=page.locator('.friend-signature-confirm');
          if(await confirm.isEnabled())throw Error('Signature can be saved empty');
          await page.mouse.move(box.x+box.width*.18,box.y+box.height*.6);
          await page.mouse.down();
          await page.mouse.move(box.x+box.width*.40,box.y+box.height*.23,{steps:12});
          await page.mouse.move(box.x+box.width*.72,box.y+box.height*.65,{steps:12});
          await page.mouse.up();
          await confirm.click();
          await page.locator('.friend-pact-scene.fully-sealed').waitFor({timeout:10000});
          await page.locator('.friend-pact-live-signature').waitFor({timeout:10000});
          console.log('SIGNATURE_SAVED',await page.evaluate(()=>Object.keys(localStorage).filter(k=>k.startsWith('thi-friendship-signature-v1:')).length));
          console.log('PASS: Friendship live mobile journey, envelope, cards, signature');
          await page.goto('https://tehiceesto.com/experiencias/mama',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.__thiMamaVoice20261009===true,null,{timeout:15000});
          console.log('PASS: Mother demo patch remains enabled');
          await browser.close();
          NODE
