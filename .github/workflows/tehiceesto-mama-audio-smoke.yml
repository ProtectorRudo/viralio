name: TeHiceEsto Mamá audio live smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tehiceesto-mama-audio-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check audio and production JavaScript hotfix
        shell: bash
        run: |
          set -euo pipefail
          FN='https://efvvadfxuyieswdqnsjg.supabase.co/functions/v1'
          JS='/_next/static/immutable/chunks/0azfo2qceywqk.js'
          echo 'Supabase audio: full response'
          curl -fsSL --max-time 35 -D /tmp/audio-headers -o /tmp/voice.opus "$FN/mama-demo-hotfix?audio=1"
          head -n 18 /tmp/audio-headers
          test "$(wc -c < /tmp/voice.opus)" -gt 20000
          head -c 4 /tmp/voice.opus | grep -q OggS
          echo 'Supabase audio: partial response'
          curl -fsSL --max-time 35 -D /tmp/range-headers -H 'Range: bytes=0-1023' -o /tmp/voice-part.opus "$FN/mama-demo-hotfix?audio=1"
          head -n 18 /tmp/range-headers
          grep -q '^HTTP/.*206' /tmp/range-headers
          test "$(wc -c < /tmp/voice-part.opus)" -eq 1024
          echo 'Supabase dynamic JavaScript'
          curl -fsSL --max-time 40 -D /tmp/js-headers -o /tmp/voice.js "$FN/mama-demo-js-patch"
          head -n 18 /tmp/js-headers
          grep -Fq '__thiMamaVoiceHotfixV2' /tmp/voice.js
          node --check /tmp/voice.js
          echo 'Public JavaScript through tehiceesto.com'
          curl -fsSL --max-time 40 -D /tmp/public-headers -o /tmp/public.js "https://tehiceesto.com$JS"
          head -n 18 /tmp/public-headers
          grep -Fq '__thiMamaVoiceHotfixV2' /tmp/public.js
          node --check /tmp/public.js
          echo 'Production demo HTML'
          curl -fsSL --max-time 40 -o /tmp/mama.html https://tehiceesto.com/experiencias/mama
          echo 'Referenced production bundles:'
          grep -oE '_next/static/immutable/chunks/[^"]+\\.js' /tmp/mama.html | head -n 25 || true
          echo 'Search live chunks for Mamá voice engine:'
          for script in $(grep -oE '_next/static/immutable/chunks/[^"]+\\.js' /tmp/mama.html | sort -u); do
            curl -fsSL --max-time 15 "https://tehiceesto.com/$script" -o /tmp/chunk-check.js || continue
            if grep -Fq 'mama-voice-toggle' /tmp/chunk-check.js; then
              echo "MAMA_ENGINE_CHUNK=$script"
              echo "BYTE_SIZE=$(wc -c < /tmp/chunk-check.js)"
            fi
          done
          echo 'SUCCESS: audio Ogg, range, hotfix JavaScript syntax and live proxy verified.'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser verify Mamá patch and real audio fetch
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const scripts=[];
          const audioRequests=[];
          page.on('response',r=>{if(r.url().includes('mama-demo-hotfix?audio=1'))audioRequests.push({status:r.status(),url:r.url()});});
          page.on('response',r=>{if(r.url().includes('/_next/static/')&&r.url().includes('.js'))scripts.push({status:r.status(),url:r.url()});});
          page.on('pageerror',e=>console.log('PAGE_ERROR:',e.message));
          await page.goto('https://tehiceesto.com/experiencias/mama',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(3500);
          const state=await page.evaluate(()=>({
            bridge:!!window.__thiMamaVoiceHotfixV2,
            mainText:document.body.innerText.slice(0,400),
            buttons:[...document.querySelectorAll('button')].slice(0,14).map(b=>({txt:b.textContent?.slice(0,40),action:b.getAttribute('data-action')})),
            scriptUrls:[...document.scripts].map(s=>s.src.split('/').at(-1)).filter(Boolean).slice(0,25)
          }));
          console.log('BROWSER:',JSON.stringify(state));
          console.log('CHUNKS:',JSON.stringify(scripts));
          for (const script of [...new Set(scripts.map(s=>s.url))]) {
            const response=await page.request.get(script,{timeout:30000});
            const body=await response.text();
            if(body.includes('mama-voice-toggle')||body.includes('thi-mama-voice-player')) {
              console.log('MAMA_ENGINE_CHUNK:',script,'BYTES:',body.length);
            }
          }
          console.log('DOM_SCRIPT_URLS:',JSON.stringify(await page.evaluate(()=>[...document.scripts].map(x=>x.src).filter(Boolean))));
          if(!state.bridge) { await browser.close(); console.error('Mamá patch not loaded by browser!'); process.exit(1); }
          console.log('PASS: Mamá route executes real audio patch on mobile browser.');

          for(let i=0;i<10;i++){
            const before=await page.evaluate(()=>({scene:document.querySelector('[data-scene]')?.getAttribute('data-scene'),sceneText:document.querySelector('.thi-scene')?.textContent?.slice(0,120),picker:document.querySelectorAll('[data-action="mama-voice-choice"]').length,buttons:[...document.querySelectorAll('button[data-action]')].map(b=>({action:b.getAttribute('data-action'),disabled:b.disabled})).slice(0,10)}));
            console.log('NAV_BEFORE_'+i+':',JSON.stringify(before));
            if(before.picker===3)break;
            if(before.scene==='care'){
              await page.locator('[data-action="care-open"]').evaluateAll(buttons=>buttons.forEach(b=>b.click()));
              await page.waitForTimeout(350);
            }
            if(before.scene==='sacrifices'){
              await page.locator('[data-action="sacrifice-open"]').evaluateAll(buttons=>buttons.forEach(b=>b.click()));
              await page.waitForTimeout(350);
            }
            const nextButton=page.locator('[data-action="next"]');
            if(await nextButton.isDisabled())throw new Error('Cannot advance legitimately from '+before.scene);
            await nextButton.evaluate(b=>b.click());
            await page.waitForTimeout(1100);
          }
          const reached=await page.locator('[data-action="mama-voice-choice"]').count();
          console.log('VOICE_PICKER_CARDS:',reached);
          if(reached!==3)throw new Error('Cannot reach three voices in mobile demo');
          await page.locator('[data-action="mama-voice-choice"]').first().click();
          await page.waitForTimeout(450);
          await page.locator('[data-action="mama-voice-toggle"]').click();
          await page.waitForTimeout(2000);
          const playing=await page.evaluate(()=>({
            status:document.querySelector('.thi-mama-voice-status')?.textContent,
            buttonState:document.querySelector('[data-action="mama-voice-toggle"]')?.getAttribute('data-voice-state'),
            speechSynthSpeaking:window.speechSynthesis?.speaking,
            wave:document.querySelector('.thi-mama-voice-wave')?.classList.contains('is-playing'),
          }));
          console.log('REAL_VOICE_PLAYER:',JSON.stringify(playing),'AUDIO_REQUESTS:',JSON.stringify(audioRequests));
          if(!audioRequests.some(r=>[200,206].includes(r.status)))throw new Error('Real recording was not requested by browser');
          if(playing.buttonState!=='playing')throw new Error('Real recording did not start playing');
          if(playing.speechSynthSpeaking)throw new Error('Synthetic TTS is still talking over real recording');
          await browser.close();
          console.log('SUCCESS: First Mamá voice plays original audio, not TTS, in actual mobile scene.');
          NODE
