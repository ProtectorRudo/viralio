name: Viralio Escape QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/page.tsx'
      - 'src/app/comercios/**'
      - 'src/app/salas/**'
      - 'src/app/escape-platform/**'
      - 'e2e/viralio-escape-home.spec.ts'
      - '.github/workflows/escape-platform-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/page.tsx'
      - 'src/app/comercios/**'
      - 'src/app/salas/**'
      - 'src/app/escape-platform/**'
      - 'e2e/viralio-escape-home.spec.ts'
      - '.github/workflows/escape-platform-qa.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed escape platform
        run: npx eslint src/app/page.tsx src/app/comercios src/app/salas src/app/escape-platform e2e/viralio-escape-home.spec.ts --max-warnings=0
      - name: Check types
        run: npm run typecheck
      - name: Build complete shared app
        run: npm run build
