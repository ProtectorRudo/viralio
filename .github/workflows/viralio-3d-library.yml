name: Construir biblioteca 3D Viralio

on:
  push:
    branches: [main]
    paths:
      - 'data/viralio-3d/catalog.json'
      - 'scripts/build-viralio-3d-library.mjs'
      - 'scripts/build-viralio-materials.mjs'
      - 'data/viralio-3d/materials.json'
      - 'data/viralio-3d/polyhaven-football-models.json'
      - 'scripts/build-football-polyhaven.mjs'
      - 'data/viralio-3d/polyhaven-universal-models.json'
      - 'scripts/build-polyhaven-universal.mjs'
      - 'data/viralio-3d/polyhaven-cinematic-models.json'
      - 'scripts/build-polyhaven-cinematic.mjs'
      - 'data/viralio-3d/polyhaven-hdri.json'
      - 'scripts/build-polyhaven-hdri.mjs'
      - '.github/workflows/viralio-3d-library.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viralio-3d-library
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar herramientas de compresion
        run: |
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock @gltf-transform/cli@4.5.1
      - name: Descargar, verificar y optimizar los modelos CC0
        run: node scripts/build-viralio-3d-library.mjs --all --min-success=45
      - name: Descargar y optimizar materiales PBR para arquitectura
        run: node scripts/build-viralio-materials.mjs
      - name: Validar materiales PBR descargados
        run: node scripts/build-viralio-materials.mjs --validate-only
      - name: Verificar que los GLB generados sean validos
        run: node scripts/build-viralio-3d-library.mjs --all --validate-only
      - name: Importar balones fotoescaneados de Poly Haven (CC0)
        run: node scripts/build-football-polyhaven.mjs
      - name: Importar mobiliario y comida fotorrealistas Poly Haven (CC0)
        run: node scripts/build-polyhaven-universal.mjs
      - name: Incorporar artefactos vintage fotorrealistas Poly Haven
        run: node scripts/build-polyhaven-cinematic.mjs
      - name: Incorporar 7 HDRI reales para atmosferas cinematograficas
        run: node scripts/build-polyhaven-hdri.mjs
      - name: Adjuntar reporte y biblioteca
        uses: actions/upload-artifact@v4
        with:
          name: viralio-3d-library
          path: |
            public/viralio-3d
            data/viralio-3d/build-report.json
            data/viralio-3d/polyhaven-football-report.json
            data/viralio-3d/polyhaven-universal-report.json
            data/viralio-3d/polyhaven-cinematic-report.json
            data/viralio-3d/hdri-report.json
          retention-days: 30
      - name: Incorporar los GLB al repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Los binarios locales optimizados son la fuente de esta publicación.
          # Reestablecemos solo HEAD/index al último remoto (no el working tree):
          # así cambios paralelos en índices generados no provocan conflictos de rebase.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add public/viralio-3d data/viralio-3d/build-report.json data/viralio-3d/polyhaven-football-report.json data/viralio-3d/polyhaven-universal-report.json data/viralio-3d/polyhaven-cinematic-report.json data/viralio-3d/hdri-report.json
            if git diff --cached --quiet; then
              echo "Library already current"
              exit 0
            fi
            git commit -m "assets: publish verified reusable Viralio 3D models and PBR textures"
            if git push origin HEAD:main; then
              echo "Published verified library"
              exit 0
            fi
            echo "Another commit landed during publish; retrying from remote ($attempt)"
          done
          echo "Failed to update asset branch after retry"
          exit 1
