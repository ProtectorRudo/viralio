name: Te Hice Esto · Cumpleaños gift QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tehiceesto-cumpleanos-gift-qa.yml"
      - "e2e/tehiceesto-birthday-gift.spec.ts"
      - "e2e/tehiceesto-birthday-wish.spec.ts"
      - "e2e/tehiceesto-birthday-balloons.spec.ts"
      - "e2e/tehiceesto-birthday-voices.spec.ts"
      - "e2e/tehiceesto-birthday-orb.spec.ts"
      - "e2e/tehiceesto-birthday-letter.spec.ts"
      - "e2e/tehiceesto-birthday-atmosphere.spec.ts"
      - "e2e/tehiceesto-birthday-hugs.spec.ts"
      - "playwright.birthday.config.ts"
      - "src/app/tehiceesto/BirthdayGiftIntro.tsx"
      - "src/app/tehiceesto/BirthdayGiftIntro.css"
      - "src/app/tehiceesto/BirthdayCakeIllustration.tsx"
      - "src/app/tehiceesto/BirthdayWishScene.tsx"
      - "src/app/tehiceesto/BirthdayWishScene.css"
      - "src/app/tehiceesto/BirthdayBalloonsScene.tsx"
      - "src/app/tehiceesto/BirthdayBalloonsScene.css"
      - "src/app/tehiceesto/BirthdayVoices.tsx"
      - "src/app/tehiceesto/BirthdayVoicesPremium.css"
      - "src/app/tehiceesto/BirthdayWishOrb.tsx"
      - "src/app/tehiceesto/BirthdayWishOrb.css"
      - "src/app/tehiceesto/BirthdayLetterPremium.css"
      - "src/app/tehiceesto/BirthdayAtmosphereMaster.css"
      - "src/app/tehiceesto/BirthdayHugsScene.tsx"
      - "src/app/tehiceesto/BirthdayHugsScene.css"
      - "public/tehiceesto/birthday-letter-botanical.svg"
      - "src/app/tehiceesto/FloatingWhatsApp.tsx"
      - "src/app/tehiceesto/ExperienceEngine.tsx"
      - "src/app/tehiceesto/data.ts"
      - "src/app/tehiceesto/experienceCopy.ts"
      - "src/app/tehiceesto/CoupleGiftIntro.tsx"
      - "src/app/tehiceesto/CoupleGiftIntro.css"

permissions:
  contents: read

concurrency:
  group: birthday-gift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  birthday-gift:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm start -- -H 127.0.0.1 -p 3000 >/tmp/birthday-gift-qa.log 2>&1 &
          for i in {1..80}; do
            if curl --connect-timeout 2 -fsS http://127.0.0.1:3000/tehiceesto/experiencias/cumpleanos >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/birthday-gift-qa.log
          exit 1
      - name: Mobile + desktop birthday gift, cake, balloons and voice recordings
        run: npx playwright test --config=playwright.birthday.config.ts
      - name: Upload screenshots and test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birthday-gift-visual-evidence
          path: |
            test-results/
            playwright-report/
            birthday-wish-evidence/
            birthday-balloons-evidence/
            birthday-voices-evidence/
            birthday-orb-evidence/
            birthday-letter-evidence/
            birthday-atmosphere-evidence/
            birthday-hugs-evidence/
          if-no-files-found: warn
          retention-days: 7
