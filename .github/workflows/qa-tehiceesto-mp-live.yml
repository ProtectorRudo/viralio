name: QA Te Hice Esto MP live

on:
  push:
    branches: [qa-mp-live-20261006]
    paths:
      - ".github/workflows/qa-tehiceesto-mp-live.yml"

permissions:
  contents: read

jobs:
  mp-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Mercado Pago production readiness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 30 'https://bwsgxpttnrctklrcjmjs.supabase.co/functions/v1/tehiceesto-checkout?status=1')"
          echo "$body"
          STATUS="$body" python - <<'PY'
          import json, os
          data=json.loads(os.environ["STATUS"])
          assert data.get("provider")=="mercadopago", data
          assert data.get("configured") is True, data
          assert data.get("tokenValid") is True, data
          assert data.get("webhookSecretPresent") is True, data
          print("MERCADOPAGO_READY")
          PY
