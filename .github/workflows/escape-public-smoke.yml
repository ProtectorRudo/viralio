name: UMBRAL public playtest smoke
# Validates real CC0 foley bundled by the static showcase builder, plus live blackout.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/escape-public-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify actual public site, filmed memory and all chapters
        run: |
          node --input-type=module <<'JS'
          import { chromium, expect } from "@playwright/test";
          const BASE="https://protectorrudo.github.io/viralio/escape";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},locale:"es-AR"});
          const errors=[];
          page.on("pageerror",err=>errors.push(err.message));
          for (const file of ["images/mansion.webp","images/room-2.webp","images/objects/doll.webp","images/objects/lock.webp","images/eva-tape-013.mp4","audio/footsteps-wood.ogg","audio/wood-creak.ogg","audio/heavy-door.ogg"]) {
            const response=await page.request.get(BASE+"/"+file);
            expect(response.status(),file).toBe(200);
            if(file.endsWith(".mp4")) expect((await response.body()).byteLength).toBeGreaterThan(30000);
          }
          await page.goto(BASE+"/",{waitUntil:"domcontentloaded",timeout:30000});
          await expect(page.getByRole("heading",{name:/UMBRAL/})).toBeVisible({timeout:15000});
          await expect(page.getByRole("button",{name:/EXPERIENCIA DE TERROR CINEMATOGRÁFICO/})).toHaveAttribute("aria-pressed","true");
          await page.getByRole("button",{name:/ENTRAR A LA CASA/}).click();
          const nav=page.getByRole("navigation",{name:"Objetos para investigar"});
          await expect(page.getByRole("heading",{name:"El vestíbulo",exact:true})).toBeVisible();
          await nav.getByRole("button",{name:"Examinar reloj"}).click();
          await expect(page.locator('[data-focus-object="clock"][data-focus-room="0"]')).toBeVisible();
          await expect(page.getByRole("slider",{name:"Manivela del reloj"})).toHaveAttribute("aria-valuenow","0");
          for(let turn=0;turn<8;turn++) await page.getByRole("button",{name:"Girar manivela un cuarto de vuelta"}).click();
          await expect(page.locator('[data-clock-solved]')).toHaveAttribute("data-clock-solved","true");
          await page.getByRole("button",{name:"Cerrar"}).click();
          await nav.getByRole("button",{name:"Abrir cerradura"}).click();
          await expect(page.locator('[data-focus-object="lock"]')).toBeVisible();
          await expect(page.locator('[data-lock-dials]')).toBeVisible();
          for (const [dial,digit] of [4,2,7].entries()) {
            for(let n=0;n<digit;n++) await page.getByRole("button",{name:"Girar dial "+(dial+1)+" hacia adelante"}).click();
          }
          await expect(page.getByRole("button",{name:/GIRAR LA LLAVE/})).toBeVisible();
          await page.getByRole("button",{name:/GIRAR LA LLAVE/}).click();
          await expect(page.getByRole("heading",{name:"El despacho",exact:true})).toBeVisible({timeout:10000});
          await nav.getByRole("button",{name:"Leer nota"}).click();
          await expect(page.getByRole("button",{name:"Dar vuelta la carta"})).toBeVisible();
          await page.getByRole("button",{name:"Dar vuelta la carta"}).click();
          await expect(page.getByRole("button",{name:"Volver al frente de la carta"})).toHaveAttribute("aria-pressed","true");
          await page.getByRole("button",{name:"Cerrar"}).click();
          for (const name of ["Vela con la luna","Vela con la llave","Vela con la rosa"]) await nav.getByRole("button",{name}).click();
          await nav.getByRole("button",{name:"Puerta secreta"}).click();
          await expect(page.getByRole("heading",{name:"La habitación de Eva",exact:true})).toBeVisible({timeout:10000});
          await nav.getByRole("button",{name:"Leer carta"}).click();
          await page.getByRole("button",{name:"Dar vuelta la carta"}).click();
          await expect(page.getByRole("button",{name:"Volver al frente de la carta"})).toBeVisible();
          await page.getByRole("button",{name:"Cerrar"}).click();
          await nav.getByRole("button",{name:"Examinar muñeca"}).click();
          await expect(page.locator('[data-focus-object="doll"][data-focus-room="2"]')).toBeVisible();
          await expect(page.getByRole("button",{name:/ESCUCHAR A LA MUÑECA/})).toBeVisible();
          await expect(page.getByText(/No apagues la música/)).toBeVisible();
          await page.getByRole("button",{name:"Cerrar"}).click();
          await expect(page.getByRole("dialog",{name:"Apagón inesperado en la casa"})).toBeVisible({timeout:12500});
          await page.getByRole("button",{name:/OMITIR SUSTO/}).click();
          await expect(page.getByRole("dialog",{name:"Apagón inesperado en la casa"})).toHaveCount(0);
          await nav.getByRole("button",{name:"Tocar caja musical"}).click();
          await expect(page.locator('[data-focus-object="music"]')).toBeVisible();
          for(const note of ["SOL","MI","LA","SOL"]) await page.getByRole("button",{name:note,exact:true}).click();
          await page.getByRole("button",{name:/REPRODUCIR CINTA 013/}).click();
          await expect(page.getByRole("heading",{name:"El último recuerdo"})).toBeVisible();
          await expect(page.locator('video[src*="eva-tape-013.mp4"]')).toHaveCount(1);
          await page.getByRole("button",{name:/PAUSAR CINTA/}).click();
          await expect(page.getByRole("button",{name:/REANUDAR CINTA/})).toBeVisible();
          await page.getByRole("button",{name:/REANUDAR CINTA/}).click();
          await page.getByRole("button",{name:/GUARDAR LA CINTA/}).click();
          await nav.getByRole("button",{name:"Abrir puerta"}).click();
          await expect(page.getByRole("heading",{name:"El corazón de la casa",exact:true})).toBeVisible({timeout:10000});
          await nav.getByRole("button",{name:"Fusible 2"}).click();
          await nav.getByRole("button",{name:"Fusible 5"}).click();
          await nav.getByRole("button",{name:"Bajar palanca"}).click();
          await page.getByRole("button",{name:/VOLVER POR EVA/}).click();
          await expect(page.getByRole("heading",{name:"No escapaste solo."})).toBeVisible();
          await expect(page.getByText(/Gracias por volver/)).toBeVisible();
          await expect(page.getByText(/MECANISMO RESTAURADO/)).toBeVisible();
          if(errors.length) throw Error("Public browser errors: "+errors.join(" | "));
          console.log("PASS: published UMBRAL tactile lock, diegetic room cameras, real CC0 sounds and complete rescued journey");

          // The published score and urgency must exist, not just the CI build.
          const timerPage=await browser.newPage({viewport:{width:390,height:844},locale:"es-AR"});
          const timerErrors=[];
          timerPage.on("pageerror",e=>timerErrors.push(e.message));
          await timerPage.clock.install({time:new Date("2026-10-09T21:00:00Z")});
          await timerPage.goto(BASE+"/",{waitUntil:"domcontentloaded",timeout:30000});
          await expect(timerPage.getByRole("button",{name:/BANDA SONORA DINÁMICA ACTIVADA/})).toHaveAttribute("aria-pressed","true");
          await timerPage.getByRole("button",{name:/12 MIN/}).click();
          await timerPage.getByRole("button",{name:/ENTRAR A LA CASA/}).click();
          await expect(timerPage.getByRole("button",{name:"Silenciar música"})).toBeVisible();
          await timerPage.clock.fastForward(710_000);
          await expect(timerPage.getByText("00:10")).toBeVisible();
          await expect(timerPage.getByLabel("Quedan 10 segundos")).toBeVisible();
          await expect(timerPage.getByText("ÚLTIMOS SEGUNDOS")).toBeVisible();
          await timerPage.getByRole("button",{name:"Silenciar música"}).click();
          await expect(timerPage.getByRole("button",{name:"Activar música"})).toHaveAttribute("aria-pressed","false");
          await timerPage.clock.fastForward(10_000);
          await expect(timerPage.getByRole("heading",{name:"La casa te recordó."})).toBeVisible();
          if(timerErrors.length) throw Error("Published score runtime errors: "+timerErrors.join(" | "));
          console.log("PASS: public adaptive score toggle, ten-second urgency and loss ending");
          await browser.close();
          JS
