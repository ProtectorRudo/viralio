name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate static showroom
        run: |
          test -f showcase/index.html
          test -f showcase/moka/index.html
          test -f showcase/atlas-barber/index.html
          test -f showcase/assets/styles.css
          node --check showcase/assets/app.js
          grep -q 'data-merchant="moka"' showcase/moka/index.html
          grep -q 'data-merchant="atlas-barber"' showcase/atlas-barber/index.html
      - name: Unit and integration tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build without deployment secrets
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viralio
          POSTGRES_PASSWORD: viralio
          POSTGRES_DB: viralio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viralio -d viralio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://viralio:viralio@127.0.0.1:5432/viralio_test
      VIRALIO_PERSISTENCE: postgres
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply migrations to empty database
        run: npm run migrate
      - name: PostgreSQL integration and concurrency tests
        run: npm run test:postgres

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viralio
          POSTGRES_PASSWORD: viralio
          POSTGRES_DB: viralio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viralio -d viralio_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://viralio:viralio@127.0.0.1:5432/viralio_e2e
      VIRALIO_PERSISTENCE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply migrations for browser tests
        run: npm run migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production responsive E2E
        run: npm run test:e2e
