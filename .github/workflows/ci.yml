name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate static showroom
        run: |
          test -f showcase/index.html
          test -f showcase/moka/index.html
          test -f showcase/atlas-barber/index.html
          test -f showcase/assets/styles.css
          node --check showcase/assets/app.js
          grep -q 'data-merchant="moka"' showcase/moka/index.html
          grep -q 'data-merchant="atlas-barber"' showcase/atlas-barber/index.html
      - name: Unit and integration tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive E2E
        run: npm run test:e2e
