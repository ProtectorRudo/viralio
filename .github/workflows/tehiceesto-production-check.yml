name: Te Hice Esto production check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tehiceesto-production-check.yml"
      - "src/app/tehiceesto/**"
      - "src/proxy.ts"
      - "next.config.ts"

concurrency:
  group: tehiceesto-production-check
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for exact Vercel production commit
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..75}; do
            version="$(curl -fsSL --max-time 25 https://tehiceesto.com/api/version || true)"
            if printf '%s' "$version" | grep -Fq "\"commit\":\"$GITHUB_SHA\""; then
              ok=1
              echo "Exact production commit is live: $GITHUB_SHA"
              break
            fi
            echo "Waiting for exact production commit (attempt $i/75)"
            sleep 8
          done
          test "$ok" -eq 1

      - name: Verify premium production markers
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 25 https://tehiceesto.com/)"
          printf '%s' "$body" | grep -Fq "Un regalo que la emociona"
          printf '%s' "$body" | grep -Fq "¿Para quién querés hacerlo?"
          printf '%s' "$body" | grep -Fq "No recibe solo un regalo"
          printf '%s' "$body" | grep -Fq "Pago seguro con Mercado Pago"
          echo "Premium production home is live."

      - name: Verify dedicated routes
        shell: bash
        run: |
          set -euo pipefail
          declare -A checks=(
            ["/crear"]="¿A quién querés"
            ["/experiencias/mama"]="Todo lo que hiciste sin pedir aplausos"
            ["/experiencias/papa"]="Todo eso tuyo que se nos quedó"
            ["/experiencias/amistad"]="Algunas amistades no se explican."
          )
          for route in "${!checks[@]}"; do
            body="$(curl -fsSL --max-time 25 "https://tehiceesto.com$route")"
            printf '%s' "$body" | grep -Fq "${checks[$route]}"
            echo "PASS $route"
          done

      - name: Reject legacy combined parent card
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 25 https://tehiceesto.com/)"
          if printf '%s' "$body" | grep -Fq "Mamá o papá"; then
            echo "::error::Legacy combined parent card is still in production"
            exit 1
          fi
          echo "No legacy parent card detected."

      - name: Verify Alina MP3 is reachable from the real dedicated host
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 -D /tmp/alina-headers -o /tmp/alina.mp3 https://tehiceesto.com/mama-voz-web.mp3
          test "$(wc -c < /tmp/alina.mp3)" -gt 30000
          grep -qi 'content-type: audio/' /tmp/alina-headers
          echo "PASS: Alina MP3 served from public TeHiceEsto domain."

