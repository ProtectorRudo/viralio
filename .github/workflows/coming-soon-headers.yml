name: Verify Coming Soon Redirects
on:
  push:
    branches: [coming-soon-live-inspect-20261009]
    paths: ['.github/workflows/coming-soon-headers.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all blocked demos redirect to branded Home
        run: |
          set -euo pipefail
          for slug in abuelos aniversario propuesta; do
            echo "TEST $slug"
            curl -sS --max-time 20 -D /tmp/headers -o /tmp/body "https://tehiceesto.com/experiencias/$slug"
            grep -iE '^(HTTP/|location:|content-type:)' /tmp/headers || true
            if grep -qiE 'location: https://tehiceesto.com/#para-quien' /tmp/headers; then
              echo "REDIRECT_PASS $slug"
            else
              echo "REDIRECT_FAIL $slug"
              head -c 500 /tmp/body;exit 1
            fi
          done
          curl -sS -L --max-time 25 -D /tmp/follow -o /tmp/home "https://tehiceesto.com/experiencias/abuelos"
          grep -q '¿Para quién querés hacerlo' /tmp/home && echo 'FINAL_HOME_PASS'
