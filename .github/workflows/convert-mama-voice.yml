name: Prepare Alina voice for Android and iPhone
on:
  push:
    branches: [fix-mama-voices-alina-20261009]
    paths:
      - ".github/workflows/convert-mama-voice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect original Alina voice
        run: |
          test -s public/mama-voz-web.opus
          ffprobe -hide_banner -v error -show_entries format=duration,format_name -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 public/mama-voz-web.opus
      - name: Convert to broadly supported MP3
        run: |
          ffmpeg -hide_banner -loglevel error -y -i public/mama-voz-web.opus -vn -c:a libmp3lame -q:a 3 -ar 44100 public/mama-voz-web.mp3
          test -s public/mama-voz-web.mp3
          ffprobe -hide_banner -v error -show_entries stream=codec_name -of default=noprint_wrappers=1 public/mama-voz-web.mp3 | grep -Fx 'codec_name=mp3'
      - name: Commit exact converted recording back to this fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mama-voz-web.mp3
          if ! git diff --cached --quiet; then
            git commit -m "fix(mama): ship Alina voice in Android-compatible MP3 format"
            git push origin HEAD:fix-mama-voices-alina-20261009
          fi
