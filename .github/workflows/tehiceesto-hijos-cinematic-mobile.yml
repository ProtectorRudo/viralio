name: TeHiceEsto Hijos cinematic mobile validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tehiceesto-hijos-mobile-smoke.mjs'
      - '.github/workflows/tehiceesto-hijos-cinematic-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compile production app
        run: npm run build
      - name: Start isolated production server
        run: |
          (npm run start -- -p 3999 > /tmp/hijos-production.log 2>&1 & echo $! > /tmp/hijos-server.pid)
          for i in $(seq 1 50); do if curl -fsS http://127.0.0.1:3999/tehiceesto/experiencias/hijos -o /dev/null; then exit 0; fi; sleep 2; done
          tail -n 140 /tmp/hijos-production.log
          exit 1
      - name: Verify light gesture, meteors, chest and mobile layout
        run: node scripts/tehiceesto-hijos-mobile-smoke.mjs
