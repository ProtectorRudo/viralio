name: Verify Mamá Audio Live Bridge
on:
  push:
    branches: [mama-live-verify-20261009]
    paths: ['.github/workflows/mama-live-verify-temp.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify MP3 endpoint and browser-range support
        run: |
          set -eux
          MP3=https://efvvadfxuyieswdqnsjg.supabase.co/functions/v1/mama-voice-mp3
          curl -fsSL --max-time 35 -D /tmp/mp3-headers -o /tmp/alina.mp3 "$MP3"
          head -20 /tmp/mp3-headers
          test "$(wc -c </tmp/alina.mp3)" -gt 30000
          file /tmp/alina.mp3
          curl -fsSL --max-time 35 -D /tmp/range-headers -H 'Range: bytes=0-1023' -o /tmp/alina-portion "$MP3"
          head -20 /tmp/range-headers
          grep -q '^HTTP/.*206' /tmp/range-headers
          test "$(wc -c </tmp/alina-portion)" -eq 1024
      - name: Verify TeHiceEsto currently serves updated JS patch
        run: |
          set -eux
          curl -fsSL --max-time 45 -D /tmp/mama-public-headers -o /tmp/mama-public.js 'https://tehiceesto.com/_next/static/immutable/chunks/0gradzqca-5xg.js'
          echo 'HEADERS PUBLIC MAMA:'; head -30 /tmp/mama-public-headers
          echo 'PUBLIC PATCH MARKERS:'; grep -oE '__thiMamaVoiceHotfixV2|__thiMamaVoiceSkipLive|mama-voice-mp3' /tmp/mama-public.js | sort | uniq -c || true
          echo 'PUBLIC JS TAIL:'; tail -c 300 /tmp/mama-public.js
          curl -fsSL --max-time 45 -D /tmp/direct-patch-headers -o /tmp/direct-patch.js 'https://efvvadfxuyieswdqnsjg.supabase.co/functions/v1/mama-demo-js-patch'
          echo 'HEADERS DIRECT PATCH:'; head -16 /tmp/direct-patch-headers
          echo 'DIRECT PATCH MARKERS:'; grep -oE '__thiMamaVoiceHotfixV2|__thiMamaVoiceSkipLive|mama-voice-mp3' /tmp/direct-patch.js | sort | uniq -c || true
          echo 'DIRECT JS TAIL:'; tail -c 300 /tmp/direct-patch.js
          wc -c /tmp/mama-public.js
          grep -Fq '__thiMamaVoice20261009' /tmp/mama-public.js
          grep -Fq '__thiMamaVoice20261009' /tmp/mama-public.js
          grep -Fq 'mama-voice-mp3' /tmp/mama-public.js
          node --check /tmp/mama-public.js
      - name: Identify actual live Mom JS bundle
        run: |
          curl -fsSL --max-time 40 https://tehiceesto.com/experiencias/mama -o /tmp/mama-live.html
          grep -oE '_next/static/immutable/chunks/[A-Za-z0-9_-]+\\.js' /tmp/mama-live.html | sort -u > /tmp/mama-scripts.txt || true
          cat /tmp/mama-scripts.txt
          while read -r part; do
            curl -fsSL --max-time 20 "https://tehiceesto.com/$part" -o /tmp/mama-piece.js || continue
            if grep -Fq 'mama-voice-toggle' /tmp/mama-piece.js; then
              echo "CURRENT_MAMA_ENGINE_BUNDLE=$part"
              wc -c /tmp/mama-piece.js
              grep -o '__thiMamaVoice20261009' /tmp/mama-piece.js | head -2 || true
            fi
          done < /tmp/mama-scripts.txt
      - name: Identify Mom engine among production scripts
        run: |
          set -eux
          for f in 2u5v7xdlfh11m.js 0zzxa124u-3tt.js 2e5v3vseouhnh.js turbopack-3egkanvz5ntfj.js 2corl6wyj4669.js 0-_ohob160l9y.js 0h8rgq4_8g54b.js 03nlifkr_qn72.js 0gradzqca-5xg.js 0c0hxoamwjsbw.js 36s0t0o8ux5as.js; do
            curl -fsSL --max-time 22 "https://tehiceesto.com/_next/static/immutable/chunks/$f" -o /tmp/chunk || continue
            echo "CHUNK=$f SIZE=$(wc -c </tmp/chunk)"
            if grep -Fq 'mama-voice-toggle' /tmp/chunk; then echo "MAMA_ENGINE_CHUNK=$f"; fi
            if grep -Fq 'thi-mama-voice-picker' /tmp/chunk; then echo "MAMA_PICKER_CHUNK=$f"; fi
          done
      - name: Install browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test the actual public Mamá demo on a mobile browser
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          page.on('pageerror', e=>console.log('PAGE_ERROR',e.message));
          page.on('console', m=>{if(m.type()==='error')console.log('PAGE_CONSOLE_ERROR',m.text().slice(0,500));});
          let audioResponses=[];
          page.on('response',r=>{if(r.url().includes('/mama-voice-mp3'))audioResponses.push(r.status())});
          const path='https://tehiceesto.com/experiencias/mama';
          async function toVoices(){
            await page.goto(path,{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('[data-action="advance"]').first().click();
            await page.getByRole('button',{name:/Seguir recordando/i}).click();
            const memoryNext=page.locator('.thi-mama-memory-local-nav>button').last();
            await memoryNext.click();await memoryNext.click();
            await page.getByRole('button',{name:/Seguir con la historia/i}).click();
            for(const i of [0,1,2])await page.locator('.mama-care-file').nth(i).click();
            await page.locator('.mama-care-continue').click();
            for(const i of [0,1,2,3])await page.locator('.mama-sacrifice-trigger').nth(i).click();
            await page.locator('.mama-sacrifice-continue').click();
            const diagnosis=await page.evaluate(()=>({scene:document.querySelector('main.thi-experience')?.getAttribute('data-scene'),patch:!!window.__thiMamaVoice20261009,sceneText:document.querySelector('section.thi-scene')?.innerText?.slice(0,300),buttons:[...document.querySelectorAll('button[data-action]')].map(b=>({a:b.getAttribute('data-action'),disabled:b.disabled,text:b.textContent?.slice(0,40)})).slice(0,12)}));
            console.log('VOICE_NAV_DIAGNOSIS',JSON.stringify(diagnosis));
            if(diagnosis.scene!=='voices')throw Error('Not in voice room');
            await page.waitForTimeout(500);
          }
          await toVoices();
          console.log('BRIDGE_DIAGNOSTIC',JSON.stringify(await page.evaluate(()=>({hotfix:!!window.__thiMamaVoice20261009,skip:!!window.__thiMamaVoice20261009,scene:document.querySelector('main.thi-experience')?.getAttribute('data-scene'),scriptUrls:[...document.scripts].filter(x=>x.src).map(x=>x.src.split('/').at(-1)).slice(0,40)}))));
          const skip=page.locator('.thi-mama-voice-skip-live');
          await skip.waitFor({timeout:10000});
          await skip.click();
          await page.waitForTimeout(600);
          if(await page.locator('main.thi-experience').getAttribute('data-scene')!=='letter')throw Error('Skip CTA did not advance');
          console.log('PASS: Mobile voice skip moves into letter with zero audios heard');
          await toVoices();
          await page.locator('[data-action="mama-voice-choice"]').first().click();
          await page.locator('[data-action="mama-voice-toggle"]').click();
          await page.waitForTimeout(1600);
          const state=await page.locator('[data-action="mama-voice-toggle"]').getAttribute('data-voice-state');
          console.log('STATE',state,'AUDIO_RESPONSE',audioResponses);
          if(state!=='playing'||!audioResponses.some(x=>x===200||x===206))throw Error('Alina MP3 not playing in real mobile browser');
          await browser.close();
          console.log('SUCCESS: live Mamá mobile demo works');
          NODE
