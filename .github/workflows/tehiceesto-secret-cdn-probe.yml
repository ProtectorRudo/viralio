name: TeHiceEsto Secret CDN bridge probe
on:
  push:
    branches: [qa-secret-route-20261009]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check isolated edge bridge and Vercel routing
        shell: bash
        run: |
          set -euo pipefail
          for u in             "https://efvvadfxuyieswdqnsjg.supabase.co/functions/v1/tehiceesto-secret-bridge"             "https://tehiceesto.com/_thi-internal-secret-preview"             "https://tehiceesto.com/_thi-internal-secret-preview?asset=js"             "https://tehiceesto.com/_thi-internal-secret-preview?asset=css"; do
            printf '\nURL %s\n' "$u"
            http="$(curl --silent --show-error --location --max-time 24 --output /tmp/bridge-response --dump-header /tmp/bridge-headers --write-out '%{http_code}' "$u" || true)"
            printf 'HTTP=%s BYTES=%s\n' "$http" "$(wc -c < /tmp/bridge-response)"
            grep -iE '^(content-type:|cache-control:|x-thi-model-version:|location:)' /tmp/bridge-headers | head -n 12 || true
            head -c 120 /tmp/bridge-response | tr '\n' ' '
            printf '\n'
          done
      - name: Verify actual Vercel routed HTML and source assets
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 25 https://tehiceesto.com/_thi-internal-secret-preview)"
          printf '%s' "$html" | grep -Fq 'Te guardé un secreto'
          printf '%s' "$html" | grep -Fq 'secret-data'
          js="$(curl -fsSL --max-time 25 'https://tehiceesto.com/_thi-internal-secret-preview?asset=js')"
          printf '%s' "$js" | grep -Fq 'SecretExperience'
          printf '%s' "$js" | grep -Fq 'La invitación'
          printf '%s' "$js" | grep -Fq 'La revelación'
          css="$(curl -fsSL --max-time 25 'https://tehiceesto.com/_thi-internal-secret-preview?asset=css')"
          printf '%s' "$css" | grep -Fq '.secret-experience'
          echo 'PASS: bridge HTML + cinematic JS + CSS available via Vercel CDN with no build'

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install project and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real mobile browser QA, ten scenes
        run: node scripts/tehiceesto-secret-cdn-browser-qa.mjs
      - name: Keep screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-cdn-qa
          path: secret-cdn-qa/
          if-no-files-found: warn
