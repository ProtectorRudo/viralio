name: Viralio Escape - authentic trailer capture review

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-escape-gameplay.mjs'
      - '.github/workflows/viralio-escape-trailer-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viralio-escape-trailer-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-real-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install recording dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Record actual scenes from all three published games
        run: node scripts/capture-escape-gameplay.mjs
      - name: Probe captured videos
        if: always()
        shell: bash
        run: |
          for video in trailer-review/*.mp4; do
            if [ -f "$video" ]; then
              echo "=== $video ==="
              ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$video"
            fi
          done
      - name: Upload videos, real screenshots and failure diagnostics for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viralio-authentic-gameplay-review
          path: trailer-review/
          retention-days: 7
          if-no-files-found: warn
