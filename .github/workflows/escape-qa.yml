name: Escape Room QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/escape/**"
      - "e2e/escape.spec.ts"
      - "e2e/rescate.spec.ts"
      - "e2e/rescate.playwright.config.ts"
      - "scripts/build-escape-standalone.mjs"
      - "e2e/escape.playwright.config.ts"
      - ".github/workflows/escape-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escape-room-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned packages
        run: npm ci
      - name: Lint escape route in isolation
        run: npx eslint src/app/escape --ext .tsx --max-warnings=0
      - name: Build shared app safely
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all escape-room browser journeys
        run: npx playwright test --config e2e/escape.playwright.config.ts
      - name: Bundle isolated invitation game
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12
          node scripts/build-escape-standalone.mjs
          test -s showcase/rescate-mauro/index.html
          test -s showcase/rescate-mauro/app.js
          test -s showcase/rescate-mauro/app.css
      - name: Play full 3D kidnapping-to-birthday journey
        run: npx playwright test --config e2e/rescate.playwright.config.ts
      - name: Save failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-failed-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve visual audit images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-visual-qa
          path: visual-qa-evidence/
          if-no-files-found: ignore
          retention-days: 14
