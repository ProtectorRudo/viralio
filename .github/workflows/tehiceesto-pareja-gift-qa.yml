name: Te Hice Esto · Pareja gift visual QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tehiceesto-pareja-gift-qa.yml"
      - "src/app/tehiceesto/CoupleGiftIntro.tsx"
      - "src/app/tehiceesto/CoupleGiftIntro.css"
      - "src/app/tehiceesto/ExperienceEngine.tsx"
      - "src/app/tehiceesto/PairCinematicUmbral.tsx"
      - "src/app/tehiceesto/PairCinematicUmbral.css"
      - "src/app/tehiceesto/PairVoicePremium.tsx"
      - "src/app/tehiceesto/PairVoicePremium.css"
      - "src/app/tehiceesto/PairMemoryLight.tsx"
      - "src/app/tehiceesto/PairMemoryLight.css"
      - "src/app/tehiceesto/PairHeartConstellation.tsx"
      - "src/app/tehiceesto/PairHeartConstellation.css"
      - "src/app/tehiceesto/tehiceesto-everyday.css"
      - "public/tehiceesto/everyday-cinematic-hd.avif"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-gift:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build source
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start -- -H 127.0.0.1 -p 3000 >/tmp/pareja-gift-app.log 2>&1 &
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:3000/tehiceesto/experiencias/pareja >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/pareja-gift-app.log
          exit 1
      - name: Test closed, unwrap and revealed mobile/desktop
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs/promises";
          await fs.mkdir("gift-visual-qa",{recursive:true});
          const browser=await chromium.launch({headless:true});
          for(const [name,width,height] of [["mobile",390,844],["desktop",1440,960]]){
            const context=await browser.newContext({viewport:{width,height},isMobile:name==="mobile",hasTouch:name==="mobile"});
            const page=await context.newPage();
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            const response=await page.goto("http://127.0.0.1:3000/tehiceesto/experiencias/pareja",{waitUntil:"domcontentloaded",timeout:30000});
            if(response?.status()!==200)throw Error("Pareja HTTP "+response?.status());
            await page.locator(".couple-gift-intro.gift-phase-closed").waitFor({timeout:12000});
            if(!(await page.locator(".couple-gift-continue").isDisabled()))throw Error("CTA enabled before unwrap");
            await page.waitForTimeout(750);
            await page.screenshot({path:"gift-visual-qa/"+name+"-closed.png",fullPage:false});
            const before=await page.evaluate(()=>({
              box:document.querySelector(".couple-gift-box-base")?.getBoundingClientRect().toJSON(),
              label:document.querySelector(".couple-gift-tag")?.getBoundingClientRect().toJSON(),
              hint:document.querySelector(".couple-gift-tap-hint")?.getBoundingClientRect().toJSON(),
              overflow:document.documentElement.scrollWidth-window.innerWidth,
              scheme:getComputedStyle(document.querySelector(".couple-gift-intro")).getPropertyValue("--gift-box")
            }));
            if(!before.box || !before.hint || before.hint.top<before.box.bottom+18)throw Error("Instruction needs more separation from box: "+JSON.stringify(before));
            if(!before.label || before.label.height<60)throw Error("Unwrap tag unreadable: "+JSON.stringify(before));
            if(before.overflow>3)throw Error("Horizontal overflow: "+before.overflow);
            if(before.scheme.includes("#d38d9b"))throw Error("Old pink box still active");
            await page.locator(".couple-gift-unseal").click();
            await page.locator(".gift-phase-untying").waitFor({timeout:3000});
            await page.locator(".gift-phase-opening").waitFor({timeout:5000});
            await page.locator(".gift-phase-revealed").waitFor({timeout:5000});
            await page.waitForTimeout(1050);
            const revealSpacing=await page.evaluate(()=>{
              const title=document.querySelector(".couple-gift-reveal h1");
              const subtitle=document.querySelector(".couple-gift-subtitle");
              const paragraph=document.querySelector(".couple-gift-opening");
              const box=document.querySelector(".couple-gift-object");
              return {titleBottom:title?.getBoundingClientRect().bottom,subtitleTop:subtitle?.getBoundingClientRect().top,
                subtitleBottom:subtitle?.getBoundingClientRect().bottom,paragraphTop:paragraph?.getBoundingClientRect().top,
                boxOpacity:box?Number(getComputedStyle(box).opacity):1};
            });
            if((revealSpacing.subtitleTop??0)-(revealSpacing.titleBottom??0)<8)throw Error("Name and subtitle too tight: "+JSON.stringify(revealSpacing));
            if((revealSpacing.paragraphTop??0)-(revealSpacing.subtitleBottom??0)<8)throw Error("Subtitle and letter too tight: "+JSON.stringify(revealSpacing));
            if(revealSpacing.boxOpacity>.08)throw Error("Opened gift obscures personalized dedication: "+JSON.stringify(revealSpacing));
            if(await page.locator(".couple-gift-continue").isDisabled())throw Error("CTA never enabled");
            if(!(await page.locator(".couple-gift-reveal h1").textContent())?.trim())throw Error("Recipient vanished");
            await page.screenshot({path:"gift-visual-qa/"+name+"-revealed.png",fullPage:false});
            await page.locator(".couple-gift-continue").click();
            await page.locator("main.thi-experience[data-scene='door']").waitFor({timeout:8000});
            const threshold=page.locator(".pair-cinematic-umbral");
            await page.locator(".pair-cinematic-umbral.is-closed").waitFor({timeout:6000});
            const door=page.locator(".pcu-door-closed-leaf");
            if(await door.count()!==1)throw Error("Physical closed door missing");
            const materials=await page.evaluate(()=>{
              const interior=document.querySelector(".pcu-door-picture");
              const leaf=document.querySelector(".pcu-door-closed-leaf");
              return {interior:getComputedStyle(interior).backgroundImage,leaf:getComputedStyle(leaf).backgroundImage,interiorOpacity:getComputedStyle(interior).opacity};
            });
            if(materials.interior.includes("url(")||materials.leaf.includes("url("))
              throw Error("Duplicated photo of doorway still exists: "+JSON.stringify(materials));
            if(Number(materials.interiorOpacity)>.05)
              throw Error("Light interior revealed before the single door opens: "+JSON.stringify(materials));
            if(await page.locator(".pcu-invitation [data-action='advance']").count())throw Error("Continue displayed before door opened");
            await page.waitForTimeout(350);
            await page.screenshot({path:"gift-visual-qa/"+name+"-threshold-closed.png",fullPage:false});
            await page.locator("[data-action='open-door']").click();
            await page.locator(".pair-cinematic-umbral.is-opening").waitFor({timeout:2500});
            await page.waitForTimeout(550);
            if((await page.locator("main.thi-experience").getAttribute("data-scene"))!=="door")throw Error("Opening incorrectly skipped the threshold");
            await page.locator(".pair-cinematic-umbral.is-open").waitFor({timeout:4500});
            const openedInterior=await page.locator(".pcu-door-picture").evaluate(el=>getComputedStyle(el).opacity);
            if(Number(openedInterior)<.95)throw Error("Lit interior not revealed after opening: "+openedInterior);
            const style=await door.evaluate(el=>getComputedStyle(el).transform);
            if(style==="none")throw Error("Door failed to rotate");
            await page.waitForTimeout(400);
            await page.screenshot({path:"gift-visual-qa/"+name+"-threshold-open.png",fullPage:false});
            const advance=page.locator(".pcu-invitation [data-action='advance']");
            if(!(await advance.isVisible()))throw Error("Continue not shown after opening");
            await advance.click();
            await page.locator("main.thi-experience[data-scene='memories']").waitFor({timeout:8000});
            await page.waitForTimeout(1450); // Wait for the view-transition overlay to fully clear
            const memoryAdvance=page.locator("main.thi-experience[data-scene='memories'] [data-action='advance']").first();
            await memoryAdvance.click();
            await page.locator("main.thi-experience[data-scene='voices']").waitFor({timeout:8000});
            await page.locator(".pair-voice-premium[data-pair-voice='premium-v1']").waitFor({timeout:5000});
            await page.waitForTimeout(1600); // Capture the settled voice design, not the prior memories transition
            const voiceCard=page.locator(".pvp-player");
            const voicePlay=page.locator(".pvp-play");
            if(!(await voiceCard.isVisible())||!(await voicePlay.isVisible()))throw Error("Premium voice card missing");
            if(await page.locator(".pvp-keep").isEnabled())throw Error("Voice CTA enabled before playback");
            if(await page.locator(".pvp-sound-bars i").count()<25)throw Error("Premium voice waveform missing");
            if(await page.locator(".pvp-duration").textContent()==="0:38")throw Error("Hard-coded demo duration detected");
            await page.screenshot({path:"gift-visual-qa/"+name+"-voice-before.png",fullPage:false});
            // Trigger media's real onPlay handler in Chromium (AAC decode support differs in CI).
            await page.locator(".pvp-player audio").evaluate(el=>el.dispatchEvent(new Event("play")));
            if(!(await page.locator(".pvp-keep").isEnabled()))throw Error("Voice CTA stayed disabled after audio play");
            await page.screenshot({path:"gift-visual-qa/"+name+"-voice-after.png",fullPage:false});
            await page.locator(".pvp-keep").click();
            await page.locator("main.thi-experience[data-scene='light']").waitFor({timeout:8000});
            await page.locator(".pair-memory-light[data-pair-light='cinematic-v2']").waitFor({timeout:5000});
            await page.waitForTimeout(1550);
            const stage=page.locator(".pml-stage");
            const photo=page.locator(".pml-photo-spot img");
            if(!(await stage.isVisible())||!(await photo.isVisible()))throw Error("Cinematic light photograph missing");
            if(await page.locator(".pml-continue").count())throw Error("Light CTA shown before exploration");
            const initialLight=await page.evaluate(()=>{
              const spot=document.querySelector(".pml-photo-spot");
              const torch=document.querySelector(".pml-beam");
              const shadow=document.querySelector(".pml-photo-shadow img");
              return {spot:Number(getComputedStyle(spot).opacity),torch:Number(getComputedStyle(torch).opacity),filter:getComputedStyle(shadow).filter};
            });
            if(initialLight.spot>.03||initialLight.torch>.03)
              throw Error("Memory picture visible before touch: "+JSON.stringify(initialLight));
            if(!initialLight.filter.includes("brightness(0.017)"))
              throw Error("Base photo not sufficiently shadowed: "+JSON.stringify(initialLight));
            const photoLoaded=await photo.evaluate(el=>el.complete && el.naturalWidth>0);
            if(!photoLoaded)console.log("NOTE:",name,"external image inaccessible in CI, verify fallback on production");
            const stageBg=await stage.evaluate(el=>getComputedStyle(el).backgroundColor);
            if(stageBg==="rgb(0, 0, 0)")throw Error("Old black photograph rectangle remains");
            const stageBox=await stage.boundingBox();
            if(!stageBox)throw Error("Light touch area has no bounds");
            await page.screenshot({path:"gift-visual-qa/"+name+"-light-before.png",fullPage:false});
            await page.mouse.move(stageBox.x+stageBox.width*.2,stageBox.y+stageBox.height*.43);
            await page.mouse.down();
            await page.locator(".pml-stage.has-interacted").waitFor({timeout:3000});
            await page.waitForTimeout(550);
            const litOpacity=await page.locator(".pml-photo-spot").evaluate(el=>Number(getComputedStyle(el).opacity));
            if(litOpacity<.8)throw Error("Flashlight did not turn on after intentional touch: "+litOpacity);
            for(let row=0;row<4;row++){
              const fromX=stageBox.x+stageBox.width*(row%2===0?.16:.84);
              const toX=stageBox.x+stageBox.width*(row%2===0?.84:.16);
              const y=stageBox.y+stageBox.height*(.29+row*.12);
              await page.mouse.move(fromX,y,{steps:3});
              await page.mouse.move(toX,y,{steps:18});
            }
            await page.mouse.up();
            await page.locator(".pair-memory-light.is-revealed").waitFor({timeout:6000});
            await page.waitForTimeout(950);
            if(!(await page.locator(".pml-reveal-message").isVisible()))throw Error("Personalized message missing after discovery");
            if(!(await page.locator(".pml-continue").isVisible()))throw Error("Continue missing after discovery");
            await page.screenshot({path:"gift-visual-qa/"+name+"-light-after.png",fullPage:false});
            await page.locator(".pml-continue").click();
            await page.locator("main.thi-experience[data-scene='stars']").waitFor({timeout:8000});
            await page.locator(".pair-heart-cinema[data-pair-heart='cinematic-v1']").waitFor({timeout:5000});
            await page.waitForTimeout(1450);
            const cosmic=page.locator(".pair-heart-cinema");
            const headline=page.locator(".phc-heading h2");
            if(!(await headline.isVisible()))throw Error("Heart headline not visible");
            if(await page.locator(".phc-star").count()!==5)throw Error("Heart must have exactly five stars");
            if(await page.locator(".phc-cta").count())throw Error("Heart CTA appears before five discoveries");
            const initialCount=await page.locator(".phc-story small").innerText();
            if(!initialCount.includes("00")||!initialCount.includes("05"))throw Error("Initial heart progress invalid: "+initialCount);
            await page.screenshot({path:"gift-visual-qa/"+name+"-heart-initial.png",fullPage:false});
            for(let i=0;i<5;i++){
              const activeStar=page.locator(".phc-star.is-active");
              if(await activeStar.count()!==1)throw Error("Expected one active star at "+i);
              await activeStar.click();
              await page.locator(".phc-star.is-found").nth(i).waitFor({timeout:3000});
              const narrative=await page.locator(".phc-story blockquote").innerText();
              if(!narrative.trim())throw Error("Personalized message missing at star "+i);
            }
            await page.locator(".pair-heart-cinema.is-complete").waitFor({timeout:3500});
            await page.waitForTimeout(1580);
            if(!(await page.locator(".phc-cta").isVisible()))throw Error("Heart continue missing");
            if(!(await page.locator(".phc-finale").isVisible()))throw Error("Heart final dedication missing");
            const ctaOverlap=await page.evaluate(()=>{
              const starText=document.querySelector(".phc-story blockquote");
              const conversion=document.querySelector("a.floating-create-cta.floating-whatsapp--experience");
              if(!starText||!conversion)return false;
              const a=starText.getBoundingClientRect(),b=conversion.getBoundingClientRect();
              return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
            });
            if(ctaOverlap)throw Error("Conversion CTA overlaps heart dedication on "+name);
            await page.screenshot({path:"gift-visual-qa/"+name+"-heart-final.png",fullPage:false});
            await page.locator(".phc-cta").click();
            await page.locator("main.thi-experience[data-scene='everyday']").waitFor({timeout:8000});
            await page.waitForTimeout(1400);
            const room=page.locator(".thi-pair-everyday .thi-everyday-room");
            if(!(await room.isVisible()))throw Error("Photographic everyday room missing");
            const bg=await room.evaluate(el=>getComputedStyle(el).backgroundImage);
            if(!bg.includes("everyday-cinematic-hd.avif"))throw Error("Approved photographic room not used");
            const imgResp=await page.request.get("http://127.0.0.1:3000/tehiceesto/everyday-cinematic-hd.avif");
            if(!imgResp.ok())throw Error("Everyday room photography returned "+imgResp.status());
            if(await page.locator(".thi-everyday-hotspot").count()!==3)throw Error("Three interactive memories missing");
            await page.screenshot({path:"gift-visual-qa/"+name+"-everyday-initial.png",fullPage:false});
            await page.locator('[data-action="everyday-window"]').click();
            await page.locator(".thi-everyday-window-fx.is-awake").waitFor({timeout:3500});
            const windowAnim=await page.locator(".thi-ewfx-glass-light").evaluate(el=>getComputedStyle(el).animationName);
            if(!windowAnim.includes("thi-window-light"))throw Error("Window ripple & light FX missing after touch");
            await page.waitForTimeout(450);
            await page.screenshot({path:"gift-visual-qa/"+name+"-window-effect.png",fullPage:false});
            await page.locator('[data-action="everyday-window"]').click();
            await page.locator(".thi-everyday-window-fx.is-awake").waitFor({timeout:2500});
            if(!(await page.locator(".thi-everyday-story").innerText()).includes("LA VENTANA"))throw Error("Window dedication not revealed");
            await page.waitForTimeout(1050);
            const narrativeVisibility=await page.locator(".thi-everyday-message").evaluate(el=>{
              const r=el.getBoundingClientRect();
              return {opacity:Number(getComputedStyle(el).opacity),top:r.top,bottom:r.bottom,viewport:innerHeight};
            });
            if(narrativeVisibility.opacity<.97||narrativeVisibility.bottom>narrativeVisibility.viewport-25)
              throw Error("Everyday message is not fully visible on "+name+": "+JSON.stringify(narrativeVisibility));
            const overlap=await page.evaluate(()=>{
              const p=document.querySelector(".thi-everyday-message p");
              const c=document.querySelector("a.floating-create-cta.floating-whatsapp--experience");
              if(!p||!c)return false;
              const a=p.getBoundingClientRect(),b=c.getBoundingClientRect();
              return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
            });
            if(overlap)throw Error("Buy button overlaps intimate memories on "+name);
            await page.screenshot({path:"gift-visual-qa/"+name+"-everyday-window.png",fullPage:false});
            await page.locator(".thi-everyday-rain-toggle").click();
            if((await page.locator(".thi-everyday-rain-toggle").getAttribute("aria-pressed"))!=="true")throw Error("Rain sound failed to start");
            await page.locator(".thi-everyday-rain-toggle").click();
            await page.locator('[data-action="everyday-cups"]').click();
            await page.locator(".thi-everyday-coffee-fx.is-awake").waitFor({timeout:3500});
            const coffeeAnim=await page.locator(".thi-ecfx-cup-glow").evaluate(el=>getComputedStyle(el).animationName);
            if(!coffeeAnim.includes("thi-coffee-warmth"))throw Error("Coffee glow FX missing after touch");
            if(await page.locator(".thi-ecfx-steam").count()<4)throw Error("Cup steam wisps missing");
            await page.waitForTimeout(400);
            await page.screenshot({path:"gift-visual-qa/"+name+"-coffee-effect.png",fullPage:false});
            await page.locator('[data-action="everyday-frame"]').click();
            await page.locator('[data-everyday-complete="true"]').waitFor({timeout:4000});
            if(!(await page.locator(".thi-everyday-continue").isVisible()))throw Error("Continue missing after all three discoveries");
            await page.waitForTimeout(1200);
            const endingVisibility=await page.locator(".thi-everyday-ending").evaluate(el=>{
              const r=el.getBoundingClientRect();
              return {opacity:Number(getComputedStyle(el).opacity),top:r.top,bottom:r.bottom,viewport:innerHeight};
            });
            if(endingVisibility.opacity<.97||endingVisibility.bottom>endingVisibility.viewport-25)
              throw Error("Everyday ending not fully visible on "+name+": "+JSON.stringify(endingVisibility));
            await page.screenshot({path:"gift-visual-qa/"+name+"-everyday-finale.png",fullPage:false});
            await page.locator(".thi-everyday-continue").click();
            await page.locator("main.thi-experience[data-scene='scratch']").waitFor({timeout:8000});
            if(errors.length)throw Error("JS errors: "+errors.join(" ; "));
            console.log("PASS",name,JSON.stringify({box:before.box,hint:before.hint,overflow:before.overflow,scene:"door"}));
            await context.close();
          }
          await browser.close();
          NODE
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pareja-midnight-gift-mobile-desktop
          path: gift-visual-qa/
          retention-days: 7
