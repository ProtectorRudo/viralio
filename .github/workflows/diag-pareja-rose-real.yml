name: Check Pareja Rose Cached Mobile
on:
  push:
    branches: [diag-pareja-rose-real-mobile-20261009]
    paths: ['.github/workflows/diag-pareja-rose-real.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare browser-cache and edge headers
        run: |
          for host in tehiceesto.com viralio.net; do
            echo "HOST $host"
            curl -sS -D /tmp/h -o /tmp/c "https://$host/_next/static/immutable/chunks/1lv4ms03n-3m3.js"
            grep -iE '^(HTTP/|cache-control:|age:|content-type:|x-thi-pair-rose-bridge:|etag:)' /tmp/h || true
            echo "PATCH $(grep -c '__thiRoseFinale20261009' /tmp/c || true)"
          done
      - name: Check alternative complete build as temporary isolated demo
        run: |
          for path in /tehiceesto/experiencias/pareja /experiencias/pareja /tehiceesto/crear; do
            echo "PREVIEW_PATH $path"
            curl -sS -D /tmp/preview-headers -o /tmp/preview-body --max-time 30 "https://viralio-e0s7dc7kg-protector-rudo-s-projects.vercel.app$path"
            grep -iE '^(HTTP/|content-type:|location:|x-vercel-protection:)' /tmp/preview-headers || true
            echo "PREVIEW_MARKER $(grep -o 'thi-rose' /tmp/preview-body | wc -l)"
          done
      - name: Check single-use Chrome cache invalidation
        run: |
          set -e
          for cookie in absent present; do
            echo "CACHE_COOKIE $cookie"
            if [ "$cookie" = present ]; then
              curl -fsSL -D /tmp/h -o /tmp/p --max-time 35 -H 'Cookie: thi_rose_refresh=1' 'https://tehiceesto.com/experiencias/pareja'
            else
              curl -fsSL -D /tmp/h -o /tmp/p --max-time 35 'https://tehiceesto.com/experiencias/pareja'
            fi
            grep -iE '^(HTTP/|clear-site-data:|set-cookie:|cache-control:|content-type:)' /tmp/h || true
            echo "HTML_OK $(grep -co 'type="module"' /tmp/p || true)"
          done
      - name: Install browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test first visit and cached revisit
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          const b=await chromium.launch({args:['--no-sandbox']});
          const page=await b.newPage({viewport:{width:390,height:760},isMobile:true,hasTouch:true});
          page.on('pageerror',e=>console.log('ERROR',e.message));
          await page.goto('https://tehiceesto.com/experiencias/pareja',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('main.thi-experience'));
          console.log('FIRST',JSON.stringify(await page.evaluate(()=>({flag:window.__thiRoseFinale20261009||false, scriptCount:[...document.scripts].filter(x=>x.src.includes('1lv4ms03n-3m3')).length,scrollY:scrollY}))));
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('main.thi-experience'));
          console.log('SECOND',JSON.stringify(await page.evaluate(()=>({flag:window.__thiRoseFinale20261009||false, scriptCount:[...document.scripts].filter(x=>x.src.includes('1lv4ms03n-3m3')).length,scrollY:scrollY}))));
          await b.close();
          NODE

      - name: Verify first-visit automatic refresh is single-use
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          const b=await chromium.launch({args:['--no-sandbox']});
          const context=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          let documents=0;
          page.on('request',r=>{if(r.isNavigationRequest()&&r.url().includes('/experiencias/pareja'))documents++});
          page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text().slice(0,240))});
          await page.goto('https://tehiceesto.com/experiencias/pareja',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(3500);
          const cookies=await context.cookies();
          const gate=cookies.find(x=>x.name==='thi_rose_refresh');
          const patch=await page.evaluate(()=>!!window.__thiRoseFinale20261009);
          console.log('AUTO_REFRESH_DIAGNOSTIC',JSON.stringify({documents,gate:!!gate,patch,url:page.url()}));
          if(!gate||!patch||documents<2||documents>3)throw Error('Single-use Android browser cache reset failed');
          await b.close();
          NODE
