name: Showroom Pages

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'src/app/escape/**'
      - 'public/escape/images/**'
      - 'scripts/build-escape-standalone.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node for standalone game
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned app dependencies and bundler
        run: |
          npm ci
          npm install --no-save --no-package-lock esbuild@0.25.12
      - name: Bundle UMBRAL without a Next server
        run: |
          node scripts/build-escape-standalone.mjs
          test -s showcase/escape/index.html
          test -s showcase/escape/app.js
          test -s showcase/escape/app.css
          test -s showcase/escape/images/mansion.webp
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static showcase
        run: |
          test -f showcase/index.html
          test -f showcase/moka/index.html
          test -f showcase/moka/moka.css
          test -f showcase/moka/moka.js
          test -f showcase/atlas-barber/index.html
          test -f showcase/atlas-barber/atlas.css
          test -f showcase/atlas-barber/atlas.js
          test -f showcase/luna-atelier/index.html
          test -f showcase/luna-atelier/luna.css
          test -f showcase/luna-atelier/luna.js
          test -f showcase/el-gordo-leo/index.html
          test -f showcase/el-gordo-leo/el-gordo-leo.css
          test -f showcase/el-gordo-leo/el-gordo-leo.js
          test -f showcase/assets/styles.css
          node --check showcase/moka/moka.js
          node --check showcase/atlas-barber/atlas.js
          node --check showcase/luna-atelier/luna.js
          node --check showcase/el-gordo-leo/el-gordo-leo.js
      - name: Upload showroom artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
