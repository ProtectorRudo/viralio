name: Showroom Pages

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'src/app/escape/**'
      - 'public/escape/images/**'
      - 'scripts/build-escape-standalone.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node for standalone game
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned app dependencies and bundler
        run: |
          npm ci
          npm install --no-save --no-package-lock esbuild@0.25.12
      - name: Bundle UMBRAL without a Next server
        run: |
          node scripts/build-escape-standalone.mjs
          test -s showcase/escape/index.html
          test -s showcase/escape/app.js
          test -s showcase/escape/app.css
          test -s showcase/escape/images/mansion.webp
          test -s showcase/rescate-mauro/index.html
          test -s showcase/rescate-mauro/app.js
          test -s showcase/rescate-mauro/app.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static showcase
        run: |
          test -f showcase/rescate-mauro/index.html
          test -f showcase/rescate-mauro/app.js
          test -f showcase/rescate-mauro/app.css
          node --check showcase/rescate-mauro/app.js
          test -f showcase/index.html
          test -f showcase/moka/index.html
          test -f showcase/moka/moka.css
          test -f showcase/moka/moka.js
          test -f showcase/atlas-barber/index.html
          test -f showcase/atlas-barber/atlas.css
          test -f showcase/atlas-barber/atlas.js
          test -f showcase/luna-atelier/index.html
          test -f showcase/luna-atelier/luna.css
          test -f showcase/luna-atelier/luna.js
          test -f showcase/el-gordo-leo/index.html
          test -f showcase/el-gordo-leo/el-gordo-leo.css
          test -f showcase/el-gordo-leo/el-gordo-leo.js
          test -f showcase/assets/styles.css
          node --check showcase/moka/moka.js
          node --check showcase/atlas-barber/atlas.js
          node --check showcase/luna-atelier/luna.js
          node --check showcase/el-gordo-leo/el-gordo-leo.js
      - name: Upload showroom artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public UMBRAL playtest URL
        shell: bash
        run: |
          set -euo pipefail
          base="https://protectorrudo.github.io/viralio/escape"
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$base/" -o /tmp/umbral-pages.html && grep -Fq "UMBRAL" /tmp/umbral-pages.html; then
              ok=1
              break
            fi
            echo "Waiting for public Pages propagation ($attempt)"
            sleep 5
          done
          test "$ok" -eq 1
          curl -fsSL --max-time 20 "$base/app.js" -o /tmp/umbral-pages.js
          curl -fsSL --max-time 20 "$base/app.css" -o /tmp/umbral-pages.css
          curl -fsSL --max-time 20 "$base/images/mansion.webp" -o /tmp/umbral-pages.webp
          test "$(wc -c </tmp/umbral-pages.js)" -gt 30000
          test "$(wc -c </tmp/umbral-pages.css)" -gt 10000
          test "$(wc -c </tmp/umbral-pages.webp)" -gt 10000
          echo "PASS: UMBRAL is publicly served at $base/"
          rescue="https://protectorrudo.github.io/viralio/rescate-mauro"
          rescue_ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$rescue/" -o /tmp/rescate-mauro.html && grep -Fq "Rescate a Mauro" /tmp/rescate-mauro.html; then
              rescue_ok=1
              break
            fi
            echo "Waiting for Rescate Mauro public Pages propagation ($attempt)"
            sleep 5
          done
          test "$rescue_ok" -eq 1
          curl -fsSL --max-time 20 "$rescue/app.js" -o /tmp/rescate-mauro.js
          curl -fsSL --max-time 20 "$rescue/app.css" -o /tmp/rescate-mauro.css
          test "$(wc -c </tmp/rescate-mauro.js)" -gt 20000
          test "$(wc -c </tmp/rescate-mauro.css)" -gt 5000
          echo "PASS: Rescate Mauro 3D invite is publicly served at $rescue/"

