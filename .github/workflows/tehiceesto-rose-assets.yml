name: TeHiceEsto Pareja — fotografías nítidas de la rosa
on:
  push:
    paths:
      - ".github/workflows/tehiceesto-rose-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-rose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare high-resolution original flower photography
        run: |
          python -m pip install --quiet Pillow requests
          python - <<'PY'
          import io, os, requests
          from PIL import Image,ImageOps,ImageFilter
          sources={
            "rose-closed.webp":"https://images.unsplash.com/photo-1584370848014-36cbe63b4458?auto=format&fit=max&w=1800&q=92",
            "rose-open.webp":"https://images.unsplash.com/photo-1522633334355-bb99c68f1b9e?auto=format&fit=max&w=1800&q=92",
          }
          root="public/tehiceesto/pareja/finale"
          os.makedirs(root,exist_ok=True)
          for name,url in sources.items():
            r=requests.get(url,timeout=35,headers={"User-Agent":"Mozilla/5.0 (compatible; TeHiceEstoAssetBuild/1.0)"})
            r.raise_for_status()
            image=Image.open(io.BytesIO(r.content)).convert("RGB")
            if min(image.size)<800: raise ValueError(f"{name} source too small: {image.size}")
            # Respect original photograph: maintain resolution and color details.
            # Original image is dark; remove only near-black studio background.
            # The transparent WebP can be naturally composited on the burgundy page.
            image.thumbnail((1400,1400),Image.Resampling.LANCZOS)
            pix=image.load()
            alpha=Image.new("L",image.size)
            a=alpha.load()
            for y in range(image.height):
              for x in range(image.width):
                red,green,blue=pix[x,y]
                foreground=max(red,green,blue)
                a[x,y]=min(255,max(0,int((foreground-11)*255/24)))
            alpha=alpha.filter(ImageFilter.GaussianBlur(.38))
            rgba=image.convert("RGBA")
            rgba.putalpha(alpha)
            # Preserve subject; pad without enlargement on a 1050x1050 canvas.
            ratio=min(1020/rgba.width,1020/rgba.height)
            nw,nh=round(rgba.width*ratio),round(rgba.height*ratio)
            if (nw,nh)!=(rgba.width,rgba.height):
              rgba=rgba.resize((nw,nh),Image.Resampling.LANCZOS)
            out=Image.new("RGBA",(1050,1050),(0,0,0,0))
            out.alpha_composite(rgba,((1050-nw)//2,(1050-nh)//2))
            out.save(os.path.join(root,name),"WEBP",quality=90,method=6)
            print(name,"original",image.size,"final",out.size,"bytes",os.path.getsize(os.path.join(root,name)))
          with open(os.path.join(root,"PHOTO-CREDITS.txt"),"w") as f:
            f.write("TeHiceEsto Pareja finale — natural rose photography\n")
            f.write("Closed red rose: Engin Akyurt, Unsplash, https://unsplash.com/photos/oN2XI7YeTIc\n")
            f.write("Open red rose: Ved Shrawak, Unsplash, https://unsplash.com/photos/9LdB5vVZyz0\n")
            f.write("Licensed under Unsplash License; source imagery preserved and re-encoded for mobile.\n")
          PY
      - name: Publish optimized and versioned assets in repository
        run: |
          git config user.name "TeHiceEsto Visual Assets"
          git config user.email "actions@users.noreply.github.com"
          git add public/tehiceesto/pareja/finale/
          git diff --cached --quiet && exit 0
          git commit -m "assets(pareja): two 1050px high definition rose states [skip ci]"
          git push origin HEAD:main
